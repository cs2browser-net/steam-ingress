name: Bug Report
description: Report a bug or issue with steam-ingress
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

        **Never paste Steam API keys, `DATABASE_URL`, `CACHE_URL` or the contents of `.env` into an issue.**

  - type: input
    id: version
    attributes:
      label: steam-ingress Version
      description: The release tag you downloaded, or the commit hash you built.
      placeholder: e.g., v1.0.0, or 13d759c
    validations:
      required: true

  - type: dropdown
    id: flavor
    attributes:
      label: Build Flavor
      description: Which build are you running?
      options:
        - Release archive
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant Config
      description: The part of `data/config.json` involved (filters, expressions, ASNs). Remove `steam_api_keys`.
      render: json
      placeholder: |
        {
            "expressions": { "max_players > 64": 2 }
        }

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Start steam-ingress with '...'
        2. Wait for the poll of region '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs/Console Output
      description: If applicable, add the console output.
      render: text
      placeholder: Paste your logs here...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here — PostgreSQL / Redis / GeoIP versions, network setup.
